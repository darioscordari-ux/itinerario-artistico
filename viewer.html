<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211d1a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Itinerario Artistico · Presentazione</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e9;color:#241e1b;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.36;cursor:default}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#211d1a;color:white;padding:11px 16px;min-height:65px}header strong{font-size:16px;flex:1;min-width:140px}header small{font-size:11px;letter-spacing:.15em;color:#dfc7aa}
.switch{display:flex;border:1px solid #85786b;border-radius:9px;overflow:hidden}.switch button{background:transparent;border:0;color:#eee;padding:9px 11px;font-size:13px}.switch button[aria-pressed=true]{background:#b9966e;color:#211d1a;font-weight:700}
main[hidden]{display:none}main{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100dvh - 65px);min-height:460px}#map{min-height:260px;background:#e8e5df}#slidePanel{background:#f5f0e9;overflow:auto;display:flex;flex-direction:column;min-height:0}#slideContent{padding:26px;flex:1}h1{font-family:Georgia,serif;font-size:clamp(28px,4vw,52px);line-height:1.1;font-weight:500;margin:6px 0 12px}#sub{color:#7a4b36;font-weight:600}#desc{font-size:17px;line-height:1.6;white-space:pre-line}#photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0}#photos img{width:100%;height:200px;object-fit:cover;border-radius:8px;background:#ddd}#photos img:only-child{grid-column:1/-1;height:clamp(220px,37vh,440px)}#photos img:first-child:nth-last-child(3){grid-column:1/-1;height:260px}#photos img:first-child:nth-last-child(4){height:180px}#video{margin:12px 0}#video iframe{width:100%;aspect-ratio:16/9;border:0}#video a{color:#825b3e}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;bottom:0;padding:12px 20px;background:#e8dfd3;border-top:1px solid #d7c9b8}nav button,#start{background:#251f1a;color:white;border:0;border-radius:8px;padding:12px 16px}nav span{font-size:14px}body[data-view=slides] main{grid-template-columns:1fr}body[data-view=slides] #map{display:none}body[data-view=map] main{grid-template-columns:1fr}body[data-view=map] #slidePanel{display:none}
#overlay{position:fixed;inset:0;background:#1e1a18;z-index:5000;display:flex;justify-content:center;align-items:center;padding:18px;color:white}#overlay[hidden]{display:none}#cover{width:min(700px,100%);max-height:94dvh;overflow:auto;text-align:center}#coverImg{width:100%;max-height:38dvh;object-fit:cover;border-radius:9px;margin:16px 0}#cover h1{font-size:clamp(34px,6vw,72px);color:#fff}#cover p{line-height:1.5;color:#ddd}#cover .byline{font-size:14px}#status{margin:20px auto;padding:20px;max-width:560px;font-size:19px;line-height:1.5}#status[hidden]{display:none}
@media(max-width:720px){header{padding:10px 12px}header strong{font-size:14px}main{height:calc(100dvh - 103px);display:flex;flex-direction:column;min-height:0}#map{flex:0 0 38%;min-height:120px}#slidePanel{flex:1;min-height:0}#slideContent{padding:14px 18px}#slideContent h1{font-size:31px}#photos{margin:10px 0}#photos img{height:115px}#photos img:only-child{height:clamp(160px,23vh,300px)}#photos img:first-child:nth-last-child(3){height:150px}#desc{font-size:15px}nav{padding:9px 14px}}
</style>
</head>
<body data-view="both">
<header><div><small>ITINERARIO ARTISTICO</small></div><strong id="projectTitle">Presentazione</strong><div class="switch" role="group" aria-label="Modalità visualizzazione"><button type="button" data-mode="map" aria-pressed="false">Mappa</button><button type="button" data-mode="slides" aria-pressed="false">Slide</button><button type="button" data-mode="both" aria-pressed="true">Entrambe</button></div></header>
<div id="status">Caricamento della presentazione…</div>
<main id="viewer" hidden><div id="map" aria-label="Mappa delle tappe"></div><section id="slidePanel"><div id="slideContent"><small id="counter"></small><h1 id="heading"></h1><div id="sub"></div><div id="photos"></div><div id="desc"></div><div id="video"></div></div><nav><button id="prev">← Indietro</button><span id="progress"></span><button id="next">Avanti →</button></nav></section></main>
<div id="overlay" hidden><div id="cover"><small>ITINERARIO ARTISTICO</small><h1 id="coverTitle"></h1><img id="coverImg" hidden alt=""><p id="coverSubtitle"></p><p id="coverDescription"></p><p class="byline" id="authors"></p><button id="start">Inizia la presentazione →</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
var el=function(id){return document.getElementById(id);};
var project=null,extras={},index=0,map=null,markers=[];
function message(s){el("status").hidden=false;el("status").textContent=s;el("viewer").hidden=true;el("overlay").hidden=true;}
function picture(src){if(typeof src!=="string"||!src.trim())return null;var im=document.createElement("img");im.src=src;im.alt="Fotografia della tappa";im.loading="lazy";im.onerror=function(){im.remove();};return im;}
function go(i){if(!project||!project.stops.length)return;index=Math.max(0,Math.min(project.stops.length-1,i));var s=project.stops[index];el("counter").textContent="TAPPA "+(index+1)+" DI "+project.stops.length;el("heading").textContent=s.title||"Tappa";el("sub").textContent=[s.subtitle,s.date,s.place].filter(Boolean).join(" · ");var item=extras[String(index)]||{};var imageList=[s.image].concat(Array.isArray(item.images)?item.images:[]).filter(Boolean);el("photos").replaceChildren();imageList.forEach(function(src){var im=picture(src);if(im)el("photos").appendChild(im);});
var description=el("desc");description.replaceChildren();if(item.textMode==="bullets"&&Array.isArray(item.bullets)&&item.bullets.length){var ul=document.createElement("ul");item.bullets.forEach(function(t){var li=document.createElement("li");li.textContent=t;ul.appendChild(li);});description.appendChild(ul);}else description.textContent=s.desc||"";
el("video").replaceChildren();if(item.video){try{var url=new URL(item.video),id="";if(url.hostname==="youtu.be")id=url.pathname.split("/")[1];else if(url.hostname.endsWith("youtube.com"))id=url.searchParams.get("v")||"";if(id&&/^[a-zA-Z0-9_-]+$/.test(id)){var frame=document.createElement("iframe");frame.src="https://www.youtube-nocookie.com/embed/"+id;frame.title="Video";frame.loading="lazy";frame.allowFullscreen=true;el("video").appendChild(frame);}else{var link=document.createElement("a");link.href=item.video;link.textContent="Apri video";link.target="_blank";link.rel="noopener noreferrer";el("video").appendChild(link);}}catch(e){}}
el("prev").disabled=index===0;el("next").disabled=index===project.stops.length-1;el("progress").textContent=(index+1)+" / "+project.stops.length;
if(map){markers.forEach(function(m,j){m.setOpacity(j===index?1:.58);});var lat=Number(s.lat),lon=Number(s.lon);if(Number.isFinite(lat)&&Number.isFinite(lon))map.panTo([lat,lon]);}
el("slidePanel").scrollTop=0;}
function initMap(){if(!window.L){el("map").textContent="Mappa temporaneamente non disponibile";return;}try{map=L.map("map",{zoomControl:true}).setView([40.3515,18.175],13);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);var bounds=[];project.stops.forEach(function(s,i){var lat=Number(s.lat),lon=Number(s.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;bounds.push([lat,lon]);var marker=L.marker([lat,lon]).addTo(map).bindPopup((i+1)+". "+String(s.title||"Tappa"));marker.on("click",function(){go(i);});markers.push(marker);});if(bounds.length>1){L.polyline(bounds,{color:"#9d543e",weight:4}).addTo(map);map.fitBounds(bounds,{padding:[26,26]});}else if(bounds.length)map.setView(bounds[0],15);}catch(err){console.warn("Errore mappa",err);}}
function ready(data){project=data.project||data;if(!project||!Array.isArray(project.stops))throw Error("Dati itinerario non validi");extras=project._slideExtras||data.slideExtras||{};el("projectTitle").textContent=project.title||"Itinerario artistico";el("status").hidden=true;el("viewer").hidden=false;initMap();if(project.stops.length)go(0);else message("Questo itinerario non contiene ancora tappe.");
el("coverTitle").textContent=project.coverTitle||project.title||"Itinerario artistico";el("coverSubtitle").textContent=project.coverSubtitle||"";el("coverDescription").textContent=project.coverDescription||project.desc||"";el("authors").textContent=(Array.isArray(project.authors)?project.authors.join(" · "):"")+(project.schoolClass?" · "+project.schoolClass:"");
var cover=picture(project.coverImage);if(cover){el("coverImg").src=cover.src;el("coverImg").hidden=false;}else el("coverImg").hidden=true;el("overlay").hidden=false;setTimeout(function(){if(map)map.invalidateSize();},100);}
el("prev").onclick=function(){go(index-1);};el("next").onclick=function(){go(index+1);};el("start").onclick=function(){el("overlay").hidden=true;setTimeout(function(){if(map)map.invalidateSize();},120);};document.querySelectorAll("[data-mode]").forEach(function(btn){btn.onclick=function(){document.body.dataset.view=btn.dataset.mode;document.querySelectorAll("[data-mode]").forEach(function(other){other.setAttribute("aria-pressed",String(other===btn));});setTimeout(function(){if(map)map.invalidateSize();},120);};});document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(index+1);if(e.key==="ArrowLeft")go(index-1);if(e.key==="Escape")el("overlay").hidden=true;});
(async function(){try{var key=new URLSearchParams(location.search).get("s");if(!key||!/^sb\.[a-f0-9-]{36}$/i.test(key))throw Error("Identificativo del link mancante o non valido");var endpoint="https://xcnsipeozpexqsephmsu.supabase.co/rest/v1/shared_itineraries?id=eq."+encodeURIComponent(key.slice(3))+"&select=payload";var response=await fetch(endpoint,{cache:"no-store",headers:{"apikey":"sb_publishable_d2KJWQld78oSUy3mtdYiNA_NdbaMvQT"}});if(!response.ok)throw Error("Servizio dati non disponibile (HTTP "+response.status+")");var rows=await response.json();if(!Array.isArray(rows)||!rows[0]||!rows[0].payload)throw Error("La presentazione non è presente nell'archivio");ready(rows[0].payload);}catch(err){console.error(err);message("Impossibile aprire la presentazione: "+(err&&err.message||"errore imprevisto"));}})();
})();
</script>
</body>
</html>
