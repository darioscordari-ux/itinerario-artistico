<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#1f211e">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Itinerario Artistico</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css?v=16">
  <link rel="stylesheet" href="./slide-content.css?v=1">
  <link rel="stylesheet" href="./mobile-edit-save.css?v=1">
</head>
<body>
  <div id="library" class="library"></div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brandmark">IA</span><div><b>Itinerario Artistico</b><small id="projectName"></small></div></div>
      <div class="toolbar">
        <button id="backBtn" class="btn">← Indietro</button>
        <button id="homeBtn" class="btn">⌂ Home</button>
        <button id="addStopBtn" class="btn primary">＋ Tappa</button>
        <button id="editStopBtn" class="btn">✎ Modifica</button>
        <button id="showAllBtn" class="btn">Percorso completo</button>
        <button id="presentBtn" class="btn">▶ Presenta</button>
        <button id="settingsBtn" class="btn">⚙</button>
        <button id="installBtn" class="btn hidden">⇩ Installa</button>
      </div>
    </header>

    <main class="workspace">
      <section class="mapPanel">
        <div id="map"></div>
        <div id="mapHint" class="mapHint">Seleziona una tappa oppure premi <b>Avanti</b>.</div>
        <div id="routeSummary" class="routeSummary hidden"></div>
      </section>

      <aside class="slidePanel">
        <div id="slide" class="slide"></div>
        <div class="slideNav">
          <button id="prevBtn" class="btn">←</button>
          <div class="progressWrap"><div class="progress"><i id="progressBar"></i></div><small id="stepText"></small></div>
          <button id="nextBtn" class="btn primary">Avanti →</button>
        </div>
      </aside>
    </main>
  </div>

  <div id="modalBack" class="modalBack hidden">
    <div id="modal" class="modal"></div>
  </div>

  <input id="photoPicker" type="file" accept="image/*" class="hidden">
  <input id="importPicker" type="file" accept="application/json,.json" class="hidden">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
    }
    if ('caches' in window) {
      caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (window.L) {
      const originalMap = L.map;
      L.map = function(id, options) {
        const m = originalMap.call(L, id, Object.assign({}, options || {}, { preferCanvas: false }));
        window.__IA_MAP = m;
        return m;
      };
      const originalTileLayer = L.tileLayer;
      L.tileLayer = function(url, options) {
        const opts = Object.assign({}, options || {}, {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
          detectRetina: false,
          keepBuffer: 2,
          updateWhenIdle: true
        });
        delete opts.subdomains;
        return originalTileLayer.call(L, 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts);
      };
    }
  </script>
  <script src="./app.js?v=17"></script>
  <script src="./progressive-route.js?v=17"></script>
  <script src="./route-editor.js?v=22"></script>
  <script src="./mobile-simple-collapse.js?v=1"></script>
  <script src="./layout-resizer.js?v=1"></script>
  <script src="./slide-content.js?v=3"></script>
  <script src="./extra-image-delete.js?v=2"></script>
  <script src="./new-stop-description.js?v=1"></script>
  <script src="./export-share.js?v=3"></script>
</body>
</html>
