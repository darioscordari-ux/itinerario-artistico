<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missione Tempio Egizio</title><style>body{font:17px/1.5 system-ui;background:#f6ead0;color:#283842;text-align:center;margin:0;padding:15vh 20px}h1{font-family:Georgia,serif}p{max-width:450px;margin:15px auto}button{font:inherit;padding:12px 18px;border:0;border-radius:8px;background:#164155;color:white}</style></head><body><h1>Missione Tempio Egizio</h1><p id="status">Caricamento delle cinque missioni…</p><script>(async()=>{try{const files=Array.from({length:25},(_,i)=>'parte-'+String(i).padStart(2,'0')+'.txt');const parts=await Promise.all(files.map(async(f)=>{const r=await fetch(f);if(!r.ok)throw Error('File '+f+' non disponibile');return await r.text()}));const html=parts.join('');if(!html.includes('</html>')||!html.includes('sphinxImages'))throw Error('Dati del gioco incompleti');document.open();document.write(html);document.close()}catch(err){document.getElementById('status').textContent='Impossibile caricare il gioco: '+err.message+'. Ricarica questa pagina.'}})();</script></body></html>
