<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'arco romano</title>
<style>
:root{--bg1:#f7f2e9;--bg2:#ece1d4;--paper:#fffdf8;--ink:#2f261f;--muted:#6d6155;--line:#dcccb8;--accent:#7c3f24;--accent2:#b87a49;--ok:#2f7d32;--bad:#b3261e;--shadow:0 10px 28px rgba(70,45,20,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2))}.app{max-width:1100px;margin:auto;padding:10px}.header{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 17px;margin-bottom:10px}.header h1{margin:0;font-family:Georgia,serif;font-size:clamp(30px,5vw,52px);color:#6e2417;line-height:1}.header p{margin:7px 0 0;color:var(--muted);font-size:clamp(13px,2vw,16px)}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:10px}.hint{margin:0 0 7px;padding:8px 10px;background:#fff3df;border:1px solid #e4c99f;border-radius:11px;color:#714b2d;font-weight:700;font-size:13px}.bank{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 7px}.tag{padding:8px 10px;border-radius:10px;border:2px solid #cfb596;background:linear-gradient(#fff,#fbf2e7);font-weight:700;font-size:13px;cursor:pointer;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.04)}.tag.sel{background:#fff0dc;border-color:var(--accent2);outline:3px solid rgba(185,122,73,.18)}.tag.dragging{opacity:.4}.figure{position:relative;width:100%;aspect-ratio:4/3;border:1px solid #e1d4c3;border-radius:14px;overflow:hidden;background:#f7f1e7}.figure svg{width:100%;height:100%;display:block}.drop{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(8px,1.45vw,14px);line-height:1.05;border-radius:8px;padding:2px 4px;cursor:pointer;color:#33281f}.drop.filled{background:rgba(255,251,242,.95);box-shadow:0 1px 5px rgba(0,0,0,.07)}.drop.ok{background:#dff1e1;outline:3px solid rgba(47,125,50,.23)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.controls button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eadfce;color:#332a23}.ghost{background:#f8f2e8;border:1px solid #ddccb9;color:#5d5044}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat,.feedback{background:#f8f2ea;border:1px solid #e2d5c6;border-radius:12px;padding:9px 11px}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat strong{font-size:18px}.feedback strong{font-size:17px}.feedback p{margin:4px 0 0;color:var(--muted);font-size:13px}.lbl{fill:#fff8e9;stroke:#8d641d;stroke-width:2}.lead{stroke:#181310;stroke-width:2;fill:none}.dot{fill:#21160f;stroke:#fff;stroke-width:1.3}.joint{stroke:#8d7767;stroke-width:1.4}.wood{stroke:#6f4527;stroke-width:8;fill:none;stroke-linecap:round}.woodthin{stroke:#9d673b;stroke-width:6;fill:none;stroke-linecap:round}.dim{stroke:#1b1714;stroke-width:2.3;fill:none}.stone{fill:url(#stoneGrad);stroke:#756453;stroke-width:1.3}.pier{fill:url(#pierGrad);stroke:#746250;stroke-width:1.3}.impost{fill:#c9b396;stroke:#745f4c;stroke-width:1.2}
@media(max-width:700px){.app{padding:6px}.header{padding:10px 12px;margin-bottom:6px}.header p{font-size:12px}.card{padding:6px}.hint{font-size:11px;padding:6px 8px;margin-bottom:5px}.bank{gap:5px;margin-bottom:5px}.tag{font-size:11px;padding:6px 7px}.controls{gap:6px;margin-top:6px}.controls button{padding:8px 9px;font-size:12px;flex:1 1 30%}.bottom{grid-template-columns:1fr;margin-top:6px}.stats{display:none}.feedback{padding:7px 9px}.feedback strong{font-size:15px}.feedback p{font-size:12px}.figure{border-radius:10px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><h1>L'arco romano</h1><p>Tocca una parola e poi il riquadro corretto. Su computer puoi anche trascinare.</p></header>
<section class="card">
<div class="hint">📱 Le parole sono subito sopra l'immagine: tocca un'etichetta e poi il riquadro corrispondente.</div>
<div class="bank" id="bank"></div>
<div class="figure">
<svg viewBox="0 0 1000 750" aria-label="Schema dell'arco romano">
<defs>
 <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4d7c3"/><stop offset=".55" stop-color="#cdb99b"/><stop offset="1" stop-color="#bda487"/></linearGradient>
 <linearGradient id="pierGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd0ba"/><stop offset="1" stop-color="#c2ad90"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".15"/></filter>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8,4 0,0 0,8Z" fill="#1b1714"/></marker>
</defs>
<rect width="1000" height="750" fill="#f8f2e6"/>
<g filter="url(#shadow)"><rect class="pier" x="155" y="400" width="160" height="285"/><rect class="pier" x="685" y="400" width="160" height="285"/></g>
<g class="joint"><path d="M155 455h160M155 510h160M155 565h160M155 620h160"/><path d="M685 455h160M685 510h160M685 565h160M685 620h160"/><path d="M205 400v285M265 400v285M735 400v285M795 400v285"/></g>
<rect class="impost" x="142" y="385" width="180" height="26"/><rect class="impost" x="678" y="385" width="180" height="26"/>
<path class="stone" filter="url(#shadow)" d="M300 390 A200 200 0 0 1 700 390 L655 390 A155 155 0 0 0 345 390Z"/>
<g class="joint"><path d="M345 390L300 390"/><path d="M355 330L310 315"/><path d="M385 275L345 245"/><path d="M430 235L405 195"/><path d="M480 215L470 170"/><path d="M520 215L530 170"/><path d="M570 235L595 195"/><path d="M615 275L655 245"/><path d="M645 330L690 315"/><path d="M655 390L700 390"/></g>
<path d="M470 170L530 170L520 218L480 218Z" fill="#c9904f" stroke="#7d5c35" stroke-width="1.5"/>
<path class="wood" d="M345 390 A155 155 0 0 1 655 390"/><path class="woodthin" d="M345 390V670M655 390V670M345 390L500 260M655 390L500 260M345 390L500 535M655 390L500 535M330 670H670"/>
<line class="dim" x1="345" y1="430" x2="655" y2="430" marker-start="url(#arr)" marker-end="url(#arr)"/><line class="dim" x1="500" y1="390" x2="500" y2="235" marker-start="url(#arr)" marker-end="url(#arr)"/>
<rect class="lbl" x="405" y="16" width="190" height="48" rx="8"/><line class="lead" x1="500" y1="64" x2="500" y2="188"/><circle class="dot" cx="500" cy="188" r="7"/>
<rect class="lbl" x="50" y="78" width="200" height="48" rx="8"/><line class="lead" x1="250" y1="102" x2="370" y2="225"/><circle class="dot" cx="370" cy="225" r="7"/>
<rect class="lbl" x="750" y="78" width="200" height="48" rx="8"/><line class="lead" x1="750" y1="102" x2="640" y2="188"/><circle class="dot" cx="640" cy="188" r="7"/>
<rect class="lbl" x="35" y="245" width="185" height="48" rx="8"/><line class="lead" x1="220" y1="269" x2="322" y2="320"/><circle class="dot" cx="322" cy="320" r="7"/>
<rect class="lbl" x="780" y="210" width="180" height="48" rx="8"/><line class="lead" x1="780" y1="234" x2="642" y2="303"/><circle class="dot" cx="642" cy="303" r="7"/>
<rect class="lbl" x="530" y="294" width="160" height="46" rx="8"/><line class="lead" x1="530" y1="317" x2="500" y2="317"/><circle class="dot" cx="500" cy="317" r="7"/>
<rect class="lbl" x="10" y="382" width="135" height="44" rx="8"/><line class="lead" x1="145" y1="404" x2="205" y2="398"/><circle class="dot" cx="205" cy="398" r="7"/>
<rect class="lbl" x="420" y="452" width="160" height="46" rx="8"/><line class="lead" x1="500" y1="452" x2="500" y2="430"/><circle class="dot" cx="500" cy="430" r="7"/>
<rect class="lbl" x="12" y="535" width="140" height="44" rx="8"/><line class="lead" x1="152" y1="557" x2="220" y2="565"/><circle class="dot" cx="220" cy="565" r="7"/>
<rect class="lbl" x="420" y="640" width="160" height="46" rx="8"/><line class="lead" x1="580" y1="663" x2="635" y2="575"/><circle class="dot" cx="635" cy="575" r="7"/>
</svg>
<div class="drop" data-answer="Concio di chiave" style="left:40.5%;top:2.1%;width:19%;height:6.4%"></div>
<div class="drop" data-answer="Concio" style="left:5%;top:10.4%;width:20%;height:6.4%"></div>
<div class="drop" data-answer="Estradosso" style="left:75%;top:10.4%;width:20%;height:6.4%"></div>
<div class="drop" data-answer="Giunti radiali" style="left:3.5%;top:32.7%;width:18.5%;height:6.4%"></div>
<div class="drop" data-answer="Intradosso" style="left:78%;top:28%;width:18%;height:6.4%"></div>
<div class="drop" data-answer="Freccia" style="left:53%;top:39.2%;width:16%;height:6.1%"></div>
<div class="drop" data-answer="Piano d'imposta" style="left:1%;top:50.9%;width:13.5%;height:5.9%"></div>
<div class="drop" data-answer="Luce" style="left:42%;top:60.3%;width:16%;height:6.1%"></div>
<div class="drop" data-answer="Piedritto" style="left:1.2%;top:71.3%;width:14%;height:5.9%"></div>
<div class="drop" data-answer="Centina" style="left:42%;top:85.3%;width:16%;height:6.1%"></div>
</div>
<div class="controls"><button class="primary" id="finito">Finito</button><button class="secondary" id="reset">Ricomincia</button><button class="ghost" id="mix">Mescola etichette</button></div>
<div class="bottom"><div class="stats"><div class="stat"><small>Riquadri completati</small><strong id="filled">0 / 10</strong></div><div class="stat"><small>Etichette rimaste</small><strong id="remain">10</strong></div></div><div class="feedback"><strong id="score">Punteggio: —</strong><p id="msg">Completa l'attività e poi premi “Finito”.</p></div></div>
</section></div>
<script>
const labels=["Concio","Concio di chiave","Giunti radiali","Intradosso","Estradosso","Piano d'imposta","Piedritto","Luce","Freccia","Centina"];
const bank=document.getElementById('bank'),drops=[...document.querySelectorAll('.drop')],score=document.getElementById('score'),msg=document.getElementById('msg'),filled=document.getElementById('filled'),remain=document.getElementById('remain');let sel=null;
const mix=a=>[...a].sort(()=>Math.random()-.5);function counters(){filled.textContent=`${drops.filter(d=>d.dataset.p).length} / ${drops.length}`;remain.textContent=bank.querySelectorAll('.tag').length}
function tag(t){const e=document.createElement('div');e.className='tag';e.textContent=t;e.dataset.v=t;e.draggable=true;e.onclick=()=>{document.querySelectorAll('.tag').forEach(x=>x.classList.remove('sel'));if(sel===e){sel=null;return}sel=e;e.classList.add('sel')};e.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',t);e.classList.add('dragging')};e.ondragend=()=>e.classList.remove('dragging');return e}
function fillBank(items=labels){bank.innerHTML='';mix(items).forEach(x=>bank.appendChild(tag(x)));counters()}function back(v){if(![...bank.querySelectorAll('.tag')].some(x=>x.dataset.v===v))bank.appendChild(tag(v));counters()}
function place(d,v){if(!v)return;if(d.dataset.p)back(d.dataset.p);drops.forEach(x=>{if(x!==d&&x.dataset.p===v){x.dataset.p='';x.textContent='';x.className='drop'}});const t=[...bank.querySelectorAll('.tag')].find(x=>x.dataset.v===v);if(t)t.remove();d.dataset.p=v;d.textContent=v;d.className='drop filled';if(sel){sel.classList.remove('sel');sel=null}counters()}
drops.forEach(d=>{d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();place(d,e.dataTransfer.getData('text/plain'))};d.onclick=()=>{if(sel)place(d,sel.dataset.v);else if(d.dataset.p){back(d.dataset.p);d.dataset.p='';d.textContent='';d.className='drop';counters()}}});
document.getElementById('finito').onclick=()=>{let ok=0,bad=[];drops.forEach(d=>{d.classList.remove('ok');const v=d.dataset.p||'';if(v&&v===d.dataset.answer){ok++;d.classList.add('ok')}else if(v){bad.push(v);d.dataset.p='';d.textContent='';d.className='drop'}});bad.forEach(back);counters();score.textContent=`Punteggio: ${ok} / ${drops.length}`;if(ok===drops.length){msg.textContent='PERFETTO!';msg.style.color='var(--ok)';msg.style.fontWeight='800';msg.style.fontSize='24px'}else{msg.textContent=`Corrette: ${ok}. Le risposte sbagliate sono state tolte: riprova.`;msg.style.color='var(--muted)';msg.style.fontWeight='400';msg.style.fontSize=''}};
document.getElementById('reset').onclick=()=>{drops.forEach(d=>{d.dataset.p='';d.textContent='';d.className='drop'});sel=null;fillBank();score.textContent='Punteggio: —';msg.textContent='Completa l\'attività e poi premi “Finito”.';msg.style.color='var(--muted)';msg.style.fontWeight='400';msg.style.fontSize=''};document.getElementById('mix').onclick=()=>fillBank([...bank.querySelectorAll('.tag')].map(x=>x.dataset.v));fillBank();
</script></body></html>
